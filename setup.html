<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตั้งค่าระบบ</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff6f7;font-family:system-ui,'Segoe UI',sans-serif;color:#16324f}
    .card{width:min(420px,calc(100% - 36px));background:white;padding:30px;border-radius:20px;box-shadow:0 12px 40px #15324f20}
    h1{margin:0 0 8px;color:#075985}p{line-height:1.6;color:#526579}
    label{display:block;margin-top:15px;font-weight:650}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c7d4;border-radius:10px;font-size:16px;margin-top:6px}
    button{width:100%;border:0;border-radius:10px;background:#087e8b;color:white;font-weight:700;padding:13px;margin-top:20px;font-size:16px}
    #msg{color:#b42318}
  </style>
</head>
<body>
  <div class="card">
    <h1>ตั้งค่าผู้ดูแลระบบ</h1>
    <p>สร้างบัญชีเจ้าของระบบครั้งแรก ข้อมูลเดโมจะบันทึกในฐานข้อมูลออนไลน์ ใช้รหัสผ่านอย่างน้อย 12 ตัวอักษร</p>
    <form id="f">
      <label>ชื่อผู้ใช้<input name="username" required minlength="3" autocomplete="username" pattern="[a-zA-Z0-9._-]+"></label>
      <label>รหัสตั้งค่าจากผู้ดูแลเว็บ<input name="setup_key" type="password" autocomplete="off"></label>
      <label>รหัสผ่าน<input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
      <label>ยืนยันรหัสผ่าน<input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label>
      <button>สร้างบัญชีและเข้าใช้งาน</button>
      <p id="msg"></p>
    </form>
  </div>
  <script>
    document.querySelector('#f').onsubmit=async e=>{
      e.preventDefault();
      const f=new FormData(e.target),p=f.get('password'),msg=document.querySelector('#msg');
      if(p!==f.get('confirm')){msg.textContent='รหัสผ่านสองช่องไม่ตรงกัน';return}
      const r=await fetch('/api/v1/auth/setup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:p,setup_key:f.get('setup_key')})});
      const d=await r.json();
      if(!r.ok){msg.textContent=d.detail||'ตั้งค่าไม่สำเร็จ';return}
      location.href='/';
    };
  </script>
</body>
</html>
