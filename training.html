<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>อบรมและพัฒนาทักษะ</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');body{font-family:Sarabun,sans-serif}</style></head><body class="min-h-screen bg-slate-100 text-slate-800"><header class="bg-indigo-950 text-white"><div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-4"><div><p class="text-xs tracking-widest text-indigo-200">COMMUNITY HEALTH · TRAINING</p><h1 class="text-2xl font-bold">อบรมและพัฒนาทักษะ</h1></div><nav class="flex flex-wrap gap-2 text-sm"><a href="/" class="rounded-lg bg-white/15 px-3 py-2 font-bold">← เลือกหน้าใช้งาน</a></nav></div></header><main class="mx-auto max-w-6xl space-y-5 px-4 py-6"><div class="rounded-xl border border-amber-300 bg-amber-50 p-4 text-sm text-amber-950">บทเรียนในหน้านี้เป็นคู่มือใช้งานระบบต้นแบบ ไม่ใช่การรับรองวิชาชีพ หลักสูตร CPR/ปฐมพยาบาลต้องเข้าฝึกกับผู้สอนที่ได้รับอนุมัติ</div><div class="flex flex-wrap gap-2"><button class="role rounded-full bg-indigo-800 px-4 py-2 text-white" data-role="ทั้งหมด">ทั้งหมด</button><button class="role rounded-full bg-white px-4 py-2" data-role="อสม.">อสม.</button><button class="role rounded-full bg-white px-4 py-2" data-role="รพ.สต.">รพ.สต.</button><button class="role rounded-full bg-white px-4 py-2" data-role="รพช.">รพช.</button><button class="role rounded-full bg-white px-4 py-2" data-role="เทศบาล">เทศบาล</button></div><div id="courses" class="grid gap-4 md:grid-cols-2"><p>กำลังโหลดหลักสูตร…</p></div></main><script>
const API='/api/v1';let allCourses=[],selected='ทั้งหมด';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{selected=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.className='role rounded-full bg-white px-4 py-2');b.className='role rounded-full bg-indigo-800 px-4 py-2 text-white';render()});
async function load(){try{const r=await fetch(API+'/training/courses'),d=await r.json();if(!r.ok)throw Error(d.detail);allCourses=d.items;render()}catch(e){document.getElementById('courses').textContent='โหลดไม่ได้: '+e.message}}
function render(){const courses=selected==='ทั้งหมด'?allCourses:allCourses.filter(c=>c.role===selected);document.getElementById('courses').innerHTML=courses.map(c=>`<article class="rounded-2xl bg-white p-5 shadow-sm"><div class="flex items-start justify-between gap-3"><div><span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-bold text-indigo-800">${esc(c.role)}</span><h2 class="mt-3 text-lg font-bold">${esc(c.title)}</h2></div><span class="whitespace-nowrap text-xs text-slate-500">${esc(c.duration)}</span></div><ol class="mt-4 list-inside list-decimal space-y-2 text-sm">${c.lessons.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="mt-5 flex items-center justify-between gap-3">${c.completed_at?`<span class="text-sm font-semibold text-emerald-700">✓ บันทึกว่าอ่านแล้ว ${new Date(c.completed_at).toLocaleDateString('th-TH')}</span>`:'<span class="text-xs text-slate-500">อ่านเนื้อหาแล้วจึงบันทึกความคืบหน้า</span>'}<button onclick="complete('${c.id}','${c.role}')" class="rounded-lg ${c.completed_at?'border':'bg-indigo-800 text-white'} px-4 py-2 text-sm font-bold">${c.completed_at?'ทบทวน':'อ่านแล้ว'}</button></div></article>`).join('')||'<p>ไม่มีหลักสูตรในหมวดนี้</p>'}
async function complete(course_id,role){try{const r=await fetch(API+'/training/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id,role})});const d=await r.json();if(!r.ok)throw Error(d.detail);await load()}catch(e){alert(e.message)}}
load();
</script></body></html>
