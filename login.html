<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff6f7;font-family:system-ui,'Segoe UI',sans-serif;color:#16324f}.card{width:min(400px,calc(100% - 36px));background:white;padding:30px;border-radius:20px;box-shadow:0 12px 40px #15324f20}h1{margin:0 0 8px;color:#075985}p{line-height:1.6;color:#526579}label{display:block;margin-top:15px;font-weight:650}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c7d4;border-radius:10px;font-size:16px;margin-top:6px}button{width:100%;border:0;border-radius:10px;background:#087e8b;color:white;font-weight:700;padding:13px;margin-top:20px;font-size:16px}#msg{color:#b42318}</style><div class="card"><h1>เข้าสู่ระบบ</h1><p>ใช้บัญชีเจ้าของระบบเพื่อดูข้อมูลจากอุปกรณ์ที่เชื่อถือ</p><form id="f"><label>ชื่อผู้ใช้<input name="username" required autocomplete="username"></label><label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ</button><p id="msg"></p></form></div><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),msg=document.querySelector('#msg'),f=new FormData(form);button.disabled=true;button.textContent='กำลังตรวจสอบ…';msg.textContent='';try{const r=await fetch('/api/v1/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'เข้าสู่ระบบไม่สำเร็จ';return}location.href='/'}catch(error){msg.textContent='เชื่อมต่อระบบไม่ได้ กรุณาตรวจว่าเซิร์ฟเวอร์ยังเปิดอยู่แล้วลองใหม่'}finally{button.disabled=false;button.textContent='เข้าสู่ระบบ'}}</script></html>
